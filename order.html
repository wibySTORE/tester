<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS - GSS TEAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; overflow-x: hidden; }
        #particles { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; }
        .detail-box { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 25px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 90%; max-width: 380px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 10; margin: 20px 0; }
        h2 { margin: 0 0 10px 0; color: #00ff87; font-weight: 800; font-size: 18px; text-transform: uppercase; }
        .timer-info { background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; padding: 10px; border-radius: 15px; margin-bottom: 15px; }
        #textTimer { font-size: 24px; font-weight: 800; color: #ff4d4d; display: block; letter-spacing: 2px; }
        .info-pembayaran { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 15px; margin-bottom: 15px; text-align: left; border-left: 4px solid #00ff87; }
        .item-price { font-size: 24px; font-weight: 800; color: #00ff87; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 10px; color: #00ff87; font-weight: 600; margin-left: 5px; }
        .input-wa { width: 100%; padding: 12px; margin-top: 5px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; font-family: 'Poppins'; outline: none; }
        .input-wa:focus { border-color: #00ff87; }
        .qris-container { background: white; padding: 10px; border-radius: 20px; margin-bottom: 15px; display: inline-block; }
        .qris-container img { width: 180px; height: auto; display: block; border-radius: 10px; }
        .upload-section { background: rgba(255, 255, 255, 0.05); border: 2px dashed #00ff87; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        #imgPreview { width: 100%; max-height: 120px; object-fit: contain; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #00ff87; }
        .btn-confirm { width: 100%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-confirm:disabled { background: #4b5563; opacity: 0.4; cursor: not-allowed; }
        .status-msg { font-size: 11px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="detail-box">
        <h2>Validasi Instan (AI)</h2>
        
        <div class="timer-info">
            <span id="textTimer">05:00</span>
            <div id="dateInfo" style="font-size: 10px; color: #00ff87; margin-top: 5px; font-weight: bold;"></div>
        </div>
        
        <div class="info-pembayaran">
            <div id="displayOrderID" style="font-size: 10px; color: #94a3b8; margin-bottom: 5px; font-family: monospace;">ID: GENERATING...</div>
            <div id="namaProduk" style="font-size: 12px; color: #cbd5e1;">-</div>
            <div id="hargaProduk" class="item-price">-</div>
        </div>

        <div class="input-group">
            <label>NOMOR WHATSAPP BUYER:</label>
            <input type="number" id="buyerWA" class="input-wa" placeholder="Contoh: 0812345678" required>
        </div>

        <div class="qris-container">
            <img id="qrisImage" src="assets/loading-qris.png" alt="QRIS">
        </div>

        <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

        <div class="upload-section">
            <p style="font-size: 11px; color: #00ff87; font-weight: 600; margin: 0 0 10px 0;">UPLOAD BUKTI TRANSFER:</p>
            <input type="file" id="buktiTf" accept="image/*" style="font-size: 12px; width: 100%;">
            
            <div id="loadingOCR" style="display:none; font-size: 11px; color: #00d9ff; margin-top: 10px; font-weight: bold;">
                🔍 AI SEDANG MEMERIKSA...
            </div>

            <img id="imgPreview" src="">
            <div id="uploadStatus" class="status-msg" style="color: #ff4d4d;">Status: Menunggu Bukti</div>
        </div>

        <button class="btn-confirm" id="btnKonfirmasi" disabled>KONFIRMASI SEKARANG</button>
        
        <a href="https://go.crisp.chat/chat/embed/?website_id=1cdef2e3-a58b-41b0-9752-68707a1035b7" target="_blank" style="text-decoration: none;">
            <button style="background:none; border:none; color:#64748b; cursor:pointer; margin-top:10px; text-decoration:underline; font-size: 11px;">
                Butuh Bantuan Admin?
            </button>
        </a>
    </div>

<script>
        const TELEGRAM_TOKEN = "7995009823:AAHok0diNdJuLf2YyxQcdEuuSMKXfFaZkiA";
        const TELEGRAM_CHAT_ID = "8206535004";
        
        let base64Image = "";
        let isExpired = false;
        const nama = localStorage.getItem('pesanan_produk');
        const hargaRaw = localStorage.getItem('pesanan_harga');
        const nominalTarget = Number(hargaRaw) * 1000;

        const orderID = "GSS-" + Math.random().toString(36).substr(2, 8).toUpperCase();
        document.getElementById('displayOrderID').innerText = "ORDER ID: " + orderID;

        if (!nama || !hargaRaw) { window.location.href = 'index.html'; }

        document.getElementById('namaProduk').innerText = "Produk: " + nama;
        document.getElementById('hargaProduk').innerText = 'Rp ' + nominalTarget.toLocaleString('id-ID');
        document.getElementById('dateInfo').innerText = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}).toUpperCase();
        document.getElementById('qrisImage').src = `qris/qris-${hargaRaw}.jpg`;

        // TIMER 5 MENIT
        let timeLimit = 300;
        const countdown = setInterval(() => {
            if (timeLimit <= 0) {
                clearInterval(countdown);
                isExpired = true;
                document.getElementById('textTimer').innerText = "00:00";
                document.getElementById('btnKonfirmasi').disabled = true;
                document.getElementById('btnKonfirmasi').innerText = "WAKTU HABIS";
                document.getElementById('btnKonfirmasi').style.background = "#4b5563";
                document.getElementById('buktiTf').disabled = true;
                window.location.href = 'index.html';
                return;
            }
            let m = Math.floor(timeLimit / 60);
            let s = timeLimit % 60;
            document.getElementById('textTimer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            timeLimit--;
        }, 1000);

        // VALIDASI AI (OCR)
        document.getElementById('buktiTf').addEventListener('change', function() {
            if (isExpired) return;
            const file = this.files[0];
            if (!file) return;
            const loadingOCR = document.getElementById('loadingOCR');
            const statusTeks = document.getElementById('uploadStatus');
            const btnKonf = document.getElementById('btnKonfirmasi');
            const preview = document.getElementById('imgPreview');

            loadingOCR.style.display = "block";
            statusTeks.innerText = "Status: AI Mengecek Data...";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result;
                preview.src = e.target.result;
                preview.style.display = "block";

                Tesseract.recognize(e.target.result, 'eng').then(({ data: { text } }) => {
                    loadingOCR.style.display = "none";
                    const cleanNumbers = text.replace(/[^0-9]/g, '');
                    const targetStr = nominalTarget.toString();

                    if (cleanNumbers.includes(targetStr)) {
                        statusTeks.innerText = "Status: VERIFIKASI BERHASIL!";
                        statusTeks.style.color = "#00ff87";
                        btnKonf.disabled = false;
                    } else {
                        statusTeks.innerText = "Status: NOMINAL TIDAK COCOK";
                        statusTeks.style.color = "#ff4d4d";
                        btnKonf.disabled = true;
                    }
                });
            };
            reader.readAsDataURL(file);
        });

        // KIRIM KE TELEGRAM DENGAN FORMAT TANGGAL LENGKAP
        document.getElementById('btnKonfirmasi').onclick = async function() {
            if (isExpired) return;

            const wa = document.getElementById('buyerWA').value;
            let formattedWA = wa.startsWith('0') ? '62' + wa.substring(1) : wa;

            if (!wa || wa.length < 8) {
                alert("Nomor WhatsApp tidak valid!");
                return;
            }

            // AMBIL WAKTU REAL-TIME
            const sekarang = new Date();
            const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const tanggalString = sekarang.toLocaleDateString('id-ID', opsiTanggal);
            const jamString = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + " WIB";

            this.innerText = "MENGIRIM...";
            this.disabled = true;

            try {
                const textKeBuyer = encodeURIComponent(`Halo Buyer GSS TEAM,\n\nPesanan *${nama}* sedang kami proses. Mohon ditunggu sebentar ya.`);
                const waLink = `https://wa.me/${formattedWA}?text=${textKeBuyer}`;

                const textTelegram = `🔔 *PESANAN BARU TERVERIFIKASI*\n` +
                                     `──────────────────\n` +
                                     `📅 *Hari/Tgl:* \`${tanggalString}\`\n` +
                                     `⏰ *Waktu:* \`${jamString}\`\n` +
                                     `🆔 *Order ID:* \`${orderID}\`\n` +
                                     `──────────────────\n` +
                                     `👤 *WhatsApp:* \`${wa}\` (GSS TEAM)\n` +
                                     `📦 *Produk:* ${nama}\n` +
                                     `💰 *Nominal:* Rp ${nominalTarget.toLocaleString('id-ID')}\n` +
                                     `──────────────────\n` +
                                     `✅ *Status:* Pembayaran Valid (AI)`;
                
                const telegramPayload = {
                    chat_id: TELEGRAM_CHAT_ID,
                    text: textTelegram,
                    parse_mode: "Markdown",
                    reply_markup: {
                        inline_keyboard: [[{ text: "🚀 CHAT BUYER SEKARANG", url: waLink }]]
                    }
                };

                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(telegramPayload)
                });

                const blob = await (await fetch(base64Image)).blob();
                const fd = new FormData();
                fd.append('chat_id', TELEGRAM_CHAT_ID);
                fd.append('photo', blob, `${orderID}.jpg`);
                fd.append('caption', `Bukti Transfer: ${orderID}\n${jamString}`);
                
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                
                localStorage.clear();
                window.location.href = "menunggu.html?wa=" + wa + "&id=" + orderID; 
            } catch (err) { 
                alert("Gagal melapor."); 
                this.disabled = false; 
                this.innerText = "KONFIRMASI SEKARANG";
            }
        };
    </script>
    <script src="anticolong.js"></script>
</body>
</html>
